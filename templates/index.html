{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='LogoGlobal.png') }}" alt="Logo" style="height: 100px; width: auto; object-fit: contain;" class="mb-3">
                <h3 class="fw-bold">E-Presensi</h3>
                <p class="text-muted">Global Institute</p>
            </div>

            <div class="card p-4">
                <form action="/" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Masukan username" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Masukan password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">MASUK</button>
                </form>
            </div>

            <div class="text-center mt-3">
                <small class="text-muted">Skripsi &copy; 2026</small>
            </div>

        </div>
    </div>
</div>
{% endblock %}
