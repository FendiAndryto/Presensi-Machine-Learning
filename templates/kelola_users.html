{% extends "base.html" %}

{% block content %}

<div class="container">
    
    <div class="alert alert-info d-flex justify-content-between align-items-center">
        <span><i class="fa-solid fa-brain me-2"></i>Jangan lupa update AI setelah menambah dataset baru.</span>
        <a href="/admin/train_model" class="btn btn-primary fw-bold">
            <i class="fa-solid fa-microchip me-2"></i>TRAINING MODEL SEKARANG
        </a>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-header fw-bold">Tambah Karyawan Baru</div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-2">
                            <label>Nama Lengkap</label>
                            <input type="text" name="nama" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label>Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label>Password</label>
                            <input type="text" name="password" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label>Divisi</label>
                            <select name="divisi" class="form-select">
                                {% for d in divisi_list %}
                                <option value="{{ d[0] }}">{{ d[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Role</label>
                            <select name="role" class="form-select">
                                <option value="Staff">Staff</option>
                                <option value="Admin">Admin</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Simpan User</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header fw-bold">Daftar User</div>
                <div class="card-body p-0">
                    <table class="table table-striped mb-0 align-middle">
                        <thead>
                            <tr>
                                <th class="ps-3">Nama</th>
                                <th>Role/Divisi</th>
                                <th>Aksi Dataset</th>
                                <th>Opsi</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for u in users %}
                            <tr>
                                <td class="ps-3 fw-bold">{{ u[1] }}</td>
                                <td>{{ u[3] }} <br> <small class="text-muted">{{ u[4] }}</small></td>
                                <td>
                                    <a href="/admin/ambil_dataset/{{ u[0] }}" class="btn btn-outline-primary btn-sm">
                                        <i class="fa-solid fa-camera me-1"></i> Ambil Foto
                                    </a>
                                </td>
                                <td>
                                    <a href="/admin/hapus_user/{{ u[0] }}" class="btn btn-danger btn-sm" onclick="return confirm('Yakin hapus?')"><i class="fa-solid fa-trash"></i></a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
