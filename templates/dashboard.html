{% extends "base.html" %}

{% block content %}

<div class="container">
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card bg-white mb-3">
                <div class="card-body text-center p-4">
                    <img src="https://ui-avatars.com/api/?name={{ nama_lengkap }}&background=0d6efd&color=fff&size=128" 
                        class="rounded-circle mb-3 shadow" width="100">
                    <h5 class="fw-bold mb-0">Halo, {{ nama_lengkap }}!</h5>
                    <p class="text-muted small">{{ nama_divisi }}</p>
                    <hr>
                    <div class="row text-center">
                        <div class="col-6 border-end">
                            <small class="text-muted fw-bold">JAM MASUK</small>
                            <h5 class="text-success fw-bold">{{ jam_masuk }}</h5>
                        </div>
                        <div class="col-6">
                            <small class="text-muted fw-bold">JAM PULANG</small>
                            <h5 class="text-danger fw-bold">{{ jam_pulang }}</h5>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h6 class="fw-bold text-secondary mb-3"><i class="fa-solid fa-map-location-dot me-2"></i>Status Lokasi</h6>
                    <div id="box-status" class="alert alert-secondary d-flex align-items-center p-2 mb-0" role="alert">
                        <i id="icon-status" class="fa-solid fa-spinner fa-spin fs-3 me-3"></i>
                        <div>
                            <span id="text-status" class="fw-bold d-block">Mencari Lokasi...</span>
                            <small id="text-jarak" style="font-size: 11px;">Menunggu GPS...</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card h-100">
                <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                    <h6 class="m-0 fw-bold text-primary"><i class="fa-solid fa-camera me-2"></i>Scan Wajah</h6>
                    <span id="badge-mode" class="badge bg-danger animate-pulse">LIVE LAPTOP</span>
                </div>
                
                <div class="card-body bg-dark p-0" style="min-height: 400px; position: relative; overflow: hidden;">
                    
                    <div id="area-laptop" style="width: 100%; height: 100%;">
                        <img src="{{ url_for('video_feed') }}" style="width: 100%; height: 100%; object-fit: cover;">
                        <div class="scan-line"></div>
                    </div>

                    <div id="area-hp" style="display: none; width: 100%; height: 100%;">
                        <video id="video-hp" style="width: 100%; height: 100%; object-fit: cover;" autoplay playsinline></video>
                        <div class="scan-line"></div>
                    </div>

                </div>

                <div class="card-footer bg-white p-3">
                    <button id="btn-absen-laptop" onclick="konfirmasiAbsen('laptop')" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                        <i class="fa-solid fa-fingerprint me-2"></i>ABSEN VIA LAPTOP
                    </button>

                    <button id="btn-absen-hp" onclick="konfirmasiAbsen('hp')" class="btn btn-success w-100 py-2 fw-bold shadow-sm" style="display: none;">
                        <i class="fa-solid fa-camera me-2"></i>AMBIL FOTO & ABSEN HP
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<canvas id="canvas-hp" style="display:none;"></canvas>

<style>
    .scan-line {
        position: absolute; width: 100%; height: 5px;
        background: rgba(0, 255, 0, 0.5); box-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        top: 0; animation: scanAnimation 3s infinite linear; z-index: 10;
    }
    @keyframes scanAnimation {
        0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; }
    }
    .animate-pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
</style>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // --- LOGIC DETEKSI DEVICE (HP vs LAPTOP) ---
    document.addEventListener("DOMContentLoaded", function() {
        const isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);
        
        if (isMobile) {
            // Aktifkan Mode HP
            document.getElementById('area-laptop').style.display = 'none';
            document.getElementById('btn-absen-laptop').style.display = 'none';
            document.getElementById('area-hp').style.display = 'block';
            document.getElementById('btn-absen-hp').style.display = 'block';
            document.getElementById('badge-mode').innerText = "LIVE MOBILE";
            document.getElementById('badge-mode').className = "badge bg-success animate-pulse";

            // Jalankan Kamera HP
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(function(stream) {
                document.getElementById('video-hp').srcObject = stream;
            })
            .catch(function(err) {
                Swal.fire('Kamera Error', "Gagal akses kamera HP: " + err, 'error');
            });
        }
        
        updateJarakRealtime();
        setInterval(updateJarakRealtime, 5000);
    });

    // --- FUNGSI UPDATE JARAK (Sama kayak kode lama lo) ---
    function updateJarakRealtime() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                fetch('/api/cek_jarak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ latitude: position.coords.latitude, longitude: position.coords.longitude }),
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById("text-jarak").innerText = "Jarak: " + data.jarak + " Meter";
                    document.getElementById("text-status").innerText = data.status_text;
                    document.getElementById("box-status").className = "alert d-flex align-items-center p-2 mb-0 " + data.status_class;
                    document.getElementById("icon-status").className = "fa-solid fs-3 me-3 " + data.icon;
                });
            });
        }
    }

    // --- FUNGSI ABSENSI ---
    function konfirmasiAbsen(mode) {
        Swal.fire({
            title: 'Konfirmasi Absensi',
            text: `Yakin ingin absen via ${mode}?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Ya, Absen!',
            cancelButtonText: 'Batal'
        }).then((result) => {
            if (result.isConfirmed) {
                if(mode === 'hp') {
                    prosesAbsenHP();
                } else {
                    ambilLokasiDanAbsenLaptop();
                }
            }
        })
    }

    // 1. PROSES ABSEN HP (Jalur Baru)
    function prosesAbsenHP() {
        const video = document.getElementById('video-hp');
        const canvas = document.getElementById('canvas-hp');
        const btn = document.getElementById("btn-absen-hp");
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Memproses Wajah...';

        // Snap foto dari video ke canvas
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const imgBase64 = canvas.toDataURL('image/jpeg');

        navigator.geolocation.getCurrentPosition(function(pos) {
            fetch('/proses_absen_mobile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    image: imgBase64, 
                    latitude: pos.coords.latitude, 
                    longitude: pos.coords.longitude 
                }),
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    Swal.fire('Berhasil!', data.pesan, 'success').then(() => location.reload());
                } else {
                    Swal.fire('Gagal!', data.pesan, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-camera me-2"></i>AMBIL FOTO & ABSEN HP';
                }
            });
        });
    }

    // 2. PROSES ABSEN LAPTOP (Logic lama lo)
    function ambilLokasiDanAbsenLaptop() {
        const btn = document.getElementById("btn-absen-laptop");
        btn.disabled = true;
        navigator.geolocation.getCurrentPosition(function(position) {
            fetch('/proses_absen', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ latitude: position.coords.latitude, longitude: position.coords.longitude }),
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    Swal.fire('Berhasil!', data.pesan, 'success').then(() => location.reload());
                } else {
                    Swal.fire('Gagal!', data.pesan, 'error');
                    btn.disabled = false;
                }
            });
        });
    }
</script>

{% endblock %}
