{% extends "base.html" %}

{% block content %}
<!-- [Isi HTML lo tetep sama sampai ke bagian Script] -->
<div class="container">
    <div class="row">
        <!-- Kolom Kiri: Profil & Status -->
        <div class="col-md-4 mb-4">
            <div class="card bg-white mb-3">
                <div class="card-body text-center p-4">
                    <img src="https://ui-avatars.com/api/?name={{ nama_lengkap }}&background=0d6efd&color=fff&size=128" 
                        class="rounded-circle mb-3 shadow" width="100">
                    <h5 class="fw-bold mb-0">Halo, {{ nama_lengkap }}!</h5>
                    <p class="text-muted small">{{ nama_divisi }}</p>
                    <hr>
                    <div class="row text-center">
                        <div class="col-6 border-end">
                            <small class="text-muted fw-bold">JAM MASUK</small>
                            <h5 class="text-success fw-bold">{{ jam_masuk }}</h5>
                        </div>
                        <div class="col-6">
                            <small class="text-muted fw-bold">JAM PULANG</small>
                            <h5 class="text-danger fw-bold">{{ jam_pulang }}</h5>
                        </div>
                    </div>
                    <div class="row text-center mt-3">
                        <div class="col-12">
                            <small class="text-muted fw-bold">DURASI KERJA</small>
                            <h5 class="text-primary fw-bold">{{ durasi_kerja }}</h5>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h6 class="fw-bold text-secondary mb-3"><i class="fa-solid fa-map-location-dot me-2"></i>Status Lokasi</h6>
                    <div id="box-status" class="alert alert-secondary d-flex align-items-center p-2 mb-0" role="alert">
                        <i id="icon-status" class="fa-solid fa-spinner fa-spin fs-3 me-3"></i>
                        <div>
                            <span id="text-status" class="fw-bold d-block">Mencari Lokasi...</span>
                            <small id="text-jarak" style="font-size: 11px;">Menunggu GPS...</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Kolom Kanan: Kamera Area -->
        <div class="col-md-8">
            <div class="card h-100">
                <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                    <h6 class="m-0 fw-bold text-primary"><i class="fa-solid fa-camera me-2"></i>Scan Wajah</h6>
                    <span id="badge-mode" class="badge bg-danger animate-pulse">LIVE LAPTOP</span>
                </div>
                
                <div class="card-body bg-dark p-0" style="min-height: 400px; position: relative; overflow: hidden;">
                    <div id="area-laptop" style="width: 100%; height: 100%;">
                        <img id="video-laptop" src="{{ url_for('video_feed') }}" style="width: 100%; height: 100%; object-fit: cover;">
                        <div class="scan-line"></div>
                    </div>
                    <div id="area-hp" style="display: none; width: 100%; height: 100%;">
                        <video id="video-hp" style="width: 100%; height: 100%; object-fit: cover;" autoplay playsinline></video>
                        <div class="scan-line"></div>
                    </div>
                </div>

                <div class="card-footer bg-white p-3">
                    <button id="btn-absen-laptop" onclick="konfirmasiAbsen('laptop')" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                        <i class="fa-solid fa-fingerprint me-2"></i>ABSEN VIA LAPTOP
                    </button>
                    <button id="btn-absen-hp" onclick="konfirmasiAbsen('hp')" class="btn btn-success w-100 py-2 fw-bold shadow-sm" style="display: none;">
                        <i class="fa-solid fa-camera me-2"></i>AMBIL FOTO & ABSEN HP
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<canvas id="canvas-hp" style="display:none;"></canvas>

<style>
    .scan-line {
        position: absolute; width: 100%; height: 5px;
        background: rgba(0, 255, 0, 0.5); box-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        top: 0; animation: scanAnimation 3s infinite linear; z-index: 10;
    }
    @keyframes scanAnimation { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }
    .animate-pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
</style>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
    const hostname = window.location.hostname;
    const isLocal = hostname === 'localhost' || hostname === '127.0.0.1';
    const isCloudflare = hostname.includes('trycloudflare.com') || hostname.includes('pendi-skripsi.com'); 
    const isNgrok = hostname.includes('ngrok');
    const isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);
    
    const isRemote = true; // FORCE ALWAYS REMOTE (DOCKER)

    if (isRemote) {
        // [PASANG SATPAM FRONTEND]
        const serverImg = document.getElementById('video-laptop');
        if (serverImg) {
            serverImg.src = ""; // Putus link-nya biar server gak kepanggil
            serverImg.remove(); // Hapus element-nya dari HTML
        }

        document.getElementById('area-laptop').style.display = 'none';
        document.getElementById('btn-absen-laptop').style.display = 'none';
        
        document.getElementById('area-hp').style.display = 'block';
        document.getElementById('btn-absen-hp').style.display = 'block';
        
        document.getElementById('badge-mode').innerText = "CAMERA AKTIF";
        document.getElementById('badge-mode').className = "badge bg-success animate-pulse";

        navigator.mediaDevices.getUserMedia({ video: true })
        .then(function(stream) {
            document.getElementById('video-hp').srcObject = stream;
        })
        .catch(function(err) {
            Swal.fire('Kamera Error', "Harap izinkan akses kamera di browser Anda: " + err, 'error');
        });
    }
    
    updateJarakRealtime();
});
    function updateJarakRealtime() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                fetch('/api/cek_jarak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        latitude: position.coords.latitude, 
                        longitude: position.coords.longitude 
                    }),
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById("text-jarak").innerText = "Jarak: " + (data.jarak || 0) + " Meter";
                    document.getElementById("text-status").innerText = data.status_text || "Lokasi Terdeteksi";
                    document.getElementById("box-status").className = "alert d-flex align-items-center p-2 mb-0 " + (data.status_class || "alert-secondary");
                    document.getElementById("icon-status").className = "fa-solid fs-3 me-3 " + (data.icon || "fa-location-dot");
                })
                .catch(err => console.error("GPS Error:", err));
            }, (error) => {
                document.getElementById("text-status").innerText = "GPS Dimatikan";
                document.getElementById("text-jarak").innerText = "Harap aktifkan lokasi";
            });
        }
    }

    function konfirmasiAbsen(mode) {
        Swal.fire({
            title: 'Konfirmasi Absensi',
            text: `Apakah Anda yakin ingin absen via ${mode}?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#0d6efd',
            confirmButtonText: 'Ya, Absen!',
            cancelButtonText: 'Batal'
        }).then((result) => {
            if (result.isConfirmed) {
                if(mode === 'hp') {
                    prosesAbsenHP();
                } else {
                    ambilLokasiDanAbsenLaptop();
                }
            }
        })
    }

    function prosesAbsenHP() {
        const video = document.getElementById('video-hp');
        const canvas = document.getElementById('canvas-hp');
        const btn = document.getElementById("btn-absen-hp");
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Memproses...';

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const imgBase64 = canvas.toDataURL('image/jpeg');

        navigator.geolocation.getCurrentPosition(function(pos) {
            fetch('/proses_absen_mobile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    image: imgBase64, 
                    latitude: pos.coords.latitude, 
                    longitude: pos.coords.longitude 
                }),
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    Swal.fire('Berhasil!', data.pesan, 'success').then(() => location.reload());
                } else {
                    Swal.fire('Gagal!', data.pesan, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-camera me-2"></i>AMBIL FOTO & ABSEN HP';
                }
            })
            .catch(() => {
                Swal.fire('Error', 'Gagal menghubungi server', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-camera me-2"></i>AMBIL FOTO & ABSEN HP';
            });
        }, () => {
            Swal.fire('GPS Error', 'Akses lokasi ditolak', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-camera me-2"></i>AMBIL FOTO & ABSEN HP';
        });
    }

    function ambilLokasiDanAbsenLaptop() {
        const btn = document.getElementById("btn-absen-laptop");
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Memproses...';

        // Capture frame dari MJPEG stream ke canvas
        const img = document.getElementById('video-laptop');
        const canvas = document.getElementById('canvas-hp');
        canvas.width = img.naturalWidth || 640;
        canvas.height = img.naturalHeight || 480;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const imgBase64 = canvas.toDataURL('image/jpeg');

        navigator.geolocation.getCurrentPosition(function(position) {
            fetch('/proses_absen', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    image: imgBase64,
                    latitude: position.coords.latitude, 
                    longitude: position.coords.longitude 
                }),
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    Swal.fire('Berhasil!', data.pesan, 'success').then(() => location.reload());
                } else {
                    Swal.fire('Gagal!', data.pesan, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-fingerprint me-2"></i>ABSEN VIA LAPTOP';
                }
            })
            .catch(() => {
                Swal.fire('Error', 'Gagal menghubungi server', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-fingerprint me-2"></i>ABSEN VIA LAPTOP';
            });
        }, () => {
            Swal.fire('GPS Error', 'Akses lokasi ditolak', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-fingerprint me-2"></i>ABSEN VIA LAPTOP';
        });
    }
</script>
{% endblock %}
